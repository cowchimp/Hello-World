services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: npm run dev
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
